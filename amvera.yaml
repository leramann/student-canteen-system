---
meta:
  environment: python
  toolchain:
    name: pip
    version: 3.11
build:
  requirementsPath: canteen-bot/requirements.txt
  useCache: true
run:
  persistenceMount: /data
  scriptName: canteen-bot/main.py
  containerPort: 80
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
