<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Столовая — меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header id="app-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>🍽 Меню столовой</h1>
            <button id="role-toggle" style="padding: 5px 10px; border-radius: 8px; border: 1px solid var(--btn); background: transparent; color: var(--btn); font-size: 12px; cursor: pointer;">Я сотрудник</button>
        </div>
        <p id="greeting"></p>
        
        <div id="view-tabs">
            <button id="tab-menu" class="active">Меню</button>
            <button id="tab-orders">Мои заказы</button>
            <button id="tab-admin" class="hidden" style="border-color: #e74c3c; color: #e74c3c;">Админ-панель</button>
        </div>
    </header>

    <main>
        <nav id="categories"></nav>
        
        <section id="menu"></section>

        <section id="orders-section" class="hidden">
            <h2 style="margin-top: 10px;">Мои заказы</h2>
            <div id="orders-list">
                <p>Загрузка заказов...</p>
            </div>
        </section>

        <section id="admin-section" class="hidden">
            <h2 style="margin-top: 10px; color: #e74c3c;">Все заказы (Админ)</h2>
            <div id="admin-orders-list">
                <p>Заказов пока нет.</p>
            </div>
        </section>

        <aside id="cart" class="hidden">
            <h2>Корзина</h2>
            <ul id="cart-items"></ul>
            <div class="cart-total">Итого: <span id="cart-total">0</span> ₽</div>
            <button id="checkout-btn">Оформить предзаказ</button>
        </aside>
    </main>

    <button id="ai-toggle" title="Спросить у шефа">👨‍🍳</button>
    <div id="ai-panel" class="hidden">
        <div id="ai-header">
            <span>Спросить у шефа</span>
            <button id="ai-close">✕</button>
        </div>
        <div id="ai-messages"></div>
        <form id="ai-form">
            <input type="text" id="ai-input" placeholder="Что посоветуешь до 300₽?" autocomplete="off">
            <button type="submit">→</button>
        </form>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
