
services:
  web:
    build: .
    container_name: canteen-bot-web
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - .:/app

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080

      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: canteen_db

    depends_on:
      db:
        condition: service_started

  db:
    image: cr.yandex/mirror/library/mariadb:10.6
    container_name: canteen-bot-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: canteen_db

    ports:
      - "3307:3306"

    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
