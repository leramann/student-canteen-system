services:
  web:
    build: .
    volumes:
      - .:/app
    environment:
      - BOT_TOKEN=8952302076:AAGorkYBGlHnudifLUzZyLdMTwF13Mj-zWk
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=secret_password
      - DB_NAME=canteen_db
    depends_on:
      - db

  db:
    image: cr.yandex/mirror/library/mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: secret_password
      MYSQL_DATABASE: canteen_db
    ports:
      - "3307:3306"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
